plugins {
    id 'com.android.application'
}

android {
    namespace 'br.sigaa.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'br.sigaa.v2'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // "dono/repositorio" no GitHub com as versões publicadas em Releases; vazio desliga a busca.
        buildConfigField 'String', 'REPO_ATUALIZACAO', '"' + (project.findProperty('repoAtualizacao') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
