plugins {
    id 'com.android.application'
}

// Chave própria do projeto: local em keystore.properties, no CI pelas variáveis de ambiente.
def chave = new Properties()
def arquivoChave = rootProject.file('keystore.properties')
if (arquivoChave.exists()) arquivoChave.withInputStream { chave.load(it) }
def caminhoChave = System.getenv('ANDROID_KEYSTORE') ?: chave['arquivo']
def senhaChave = System.getenv('ANDROID_KEYSTORE_SENHA') ?: chave['senha']

android {
    namespace 'br.sigaa.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'br.sigaa.v2'
        minSdk 29
        targetSdk 35
        versionCode 31
        versionName '0.6.8'
        // "dono/repositorio" no GitHub com as versões publicadas em Releases; vazio desliga a busca.
        buildConfigField 'String', 'REPO_ATUALIZACAO', '"' + (project.findProperty('repoAtualizacao') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        projeto {
            if (caminhoChave) {
                storeFile file(caminhoChave)
                storePassword senhaChave
                keyAlias 'sigaa'
                keyPassword senhaChave
            }
        }
    }

    buildTypes {
        debug {
            // Mesma assinatura das releases: o app instalado por cabo recebe as atualizações publicadas.
            if (caminhoChave) signingConfig signingConfigs.projeto
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig caminhoChave ? signingConfigs.projeto : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
